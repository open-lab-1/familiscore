<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🚀 BALISES MAGIQUES GOOGLE (SEO) -->
    <title>FamiliScore — Application de Points et Récompenses en Famille</title>
    <meta name="description" content="Découvrez FamiliScore, l'application gratuite pour motiver vos enfants au quotidien. Transformez les devoirs, corvées et l'autonomie en points et récompenses ludiques.">
    <meta name="keywords" content="application points enfants, tableau recompense famille, motiver ses enfants, éducation positive app, FamiliScore, tâches ménagères enfants, application familiale gratuite">
    <meta name="author" content="Fagegaltie">
    <meta name="robots" content="index, follow">

    <!-- 📱 BALISES POUR LES RÉSEAUX (FACEBOOK, WHATSAPP, DISCORD) -->
    <meta property="og:title" content="FamiliScore — Le jeu de l'autonomie en famille">
    <meta property="og:description" content="L'application mobile gratuite qui transforme l'entraide et les tâches du quotidien en points et récompenses !">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lovable.app">

    <!-- 🎨 STYLE VISUEL (Assorti à votre Dark Mode Néon) -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0A0A0C;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            padding: 25px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            margin: 20px;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #8B5CF6, #00FF87);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        p {
            color: #A0AEC0;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-install {
            display: inline-block;
            background: linear-gradient(135deg, #8B5CF6, #7C3AED);
            color: #FFFFFF;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-install:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.7);
        }
        .footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #4A5568;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Remplacera le texte par votre icône demain -->
        <div style="font-size: 4rem; margin-bottom: 10px;">🏆</div>
        <h1>FamiliScore</h1>
        <p>L'application d'entraide et d'autonomie en famille entierement GRATUITE !. Devoirs, coups de main et petites victoires du quotidien deviennent des points et des récompenses !</p>
        
        <!-- LE GROS BOUTON D'INSTALLATION -->
        <a href="https://lovable.app" target="_blank" class="btn-install">Installer l'Application</a>
    </div>

    <div class="footer">
        &copy; 2026 FamiliScore® par Noa Fagegaltié. Tous droits réservés.
    </div>

</body>
</html>
